[package]
name = "ethercat-workbench"
version = "0.26.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/votecoffee/EthercatWorkbench"
description = "Windows EtherCAT MainDevice bench workbench and TxPDO logger"
default-run = "ethercat-workbench"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossbeam-queue = "0.3"
csv = "1.3"
ctrlc = "3.4"
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
hex = "0.4"
hdrhistogram = { version = "7", default-features = false }
roxmltree = "0.20"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
spin_sleep = "1.3"

[target.'cfg(windows)'.dependencies]
ethercrab = { git = "https://github.com/ethercrab-rs/ethercrab.git", rev = "fec2730823ce1eb62425f83d5df49d678f03b104", default-features = false, features = ["std"] }
pcap = "2.2"
windows-sys = { version = "0.61.2", features = ["Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Performance"] }

[profile.release]
strip = true
